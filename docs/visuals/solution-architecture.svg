<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de solución: Servicios ciudadanos</title>
<desc id="desc">Dos vistas separan la evidencia local de un piloto Salesforce propuesto. El LWC usa datos locales, AgentScript es una referencia y Mule contiene contratos y un flujo preliminar. La propuesta conecta Experience Cloud, identidad, Agentforce y tres capas API. Escritura confirmada y revisión humana siguen pendientes. El portal público no quedó confirmado operativo.</desc>
