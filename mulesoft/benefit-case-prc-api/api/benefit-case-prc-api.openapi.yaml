openapi: 3.0.3
info:
  title: Benefit Case Process API
  version: 0.1.0-draft
  description: |
    Draft Process API for the Salesforce citizen-service demonstration.

    API-led layer: Process API.
    Downstream system API: benefit-status-sys-api.
    Intended upstream consumers: Agentforce Benefit Experience API, portal, or contact-center tooling.

    This contract applies reusable business rules over the legacy status: SLA posture,
    handoff decision, next action, and audit event generation. It is a design artifact,
    not a deployed runtime.
servers:
  - url: https://{host}/{basePath}
    variables:
      host:
        default: api.example.invalid
        description: VERIFY runtime host after CloudHub 2.0, Runtime Fabric, or gateway target is selected.
      basePath:
        default: benefit-case-prc-api/v1
tags:
  - name: Benefit Cases
security:
  - clientCredentials: []
paths:
  /benefit-cases/{caseId}/decision-context:
    get:
      tags:
        - Benefit Cases
      summary: Build reusable decision context for a benefit case
      operationId: getBenefitCaseDecisionContext
      description: |
        Reads normalized status from the System API and adds reusable service rules:
        SLA status, handoff reason, next action, and audit identifiers.
      parameters:
        - name: caseId
          in: path
          required: true
          description: Demo benefit case identifier.
          schema:
            type: string
            pattern: ^BEN-[0-9]{4}-[0-9]{6}$
            example: BEN-2026-004219
        - name: x-correlation-id
          in: header
          required: false
          description: Optional caller-provided correlation id for end-to-end traceability.
          schema:
            type: string
            minLength: 8
            maxLength: 80
            example: demo-corr-001
      responses:
        "200":
          description: Decision context built for the case.
          headers:
            x-correlation-id:
              description: Correlation id propagated or generated by the API.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitCaseDecisionContext"
              examples:
                mariaPendingDocument:
                  summary: Persona Demo A can be handled autonomously
                  value:
                    caseId: BEN-2026-004219
                    citizenDisplayName: Persona Demo A
                    citizenRefMasked: CIT-****-4219
                    benefitType: Benefit renewal
                    statusCode: PENDING_DOCUMENT
                    statusLabel: Pending document
                    missingDocument: Proof of residence
                    deadline: "2026-07-05"
                    preferredChannel: WhatsApp
                    slaStatus: AT_RISK
                    nextAction: Upload proof of residence before 2026-07-05.
                    handoffRequired: false
                    handoffReason: null
                    sourceSystem: COBOLSIM
                    lastSyncedAt: "2026-07-01T00:00:00Z"
                    correlationId: demo-corr-001
                    auditEventId: aud-demo-4219-001
                valentinaEscalated:
                  summary: Persona Demo B requires human review
                  value:
                    caseId: BEN-2026-004227
                    citizenDisplayName: Persona Demo B
                    citizenRefMasked: CIT-****-1008
                    benefitType: Benefit renewal
                    statusCode: ESCALATED_TO_AGENT
                    statusLabel: Escalated to agent
                    missingDocument: Proof of residence
                    deadline: "2026-07-24"
                    preferredChannel: Phone
                    slaStatus: IN_PROGRESS
                    nextAction: Route to a public servant with appeal context attached.
                    handoffRequired: true
                    handoffReason: Appeal or exception requires human judgment.
                    sourceSystem: COBOLSIM
                    lastSyncedAt: "2026-07-01T00:00:00Z"
                    correlationId: demo-corr-002
                    auditEventId: aud-demo-4227-001
        "400":
          description: Invalid case id or malformed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found in the system of record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                caseNotFound:
                  summary: Benefit case not found
                  value:
                    errorCode: CASE_NOT_FOUND
                    message: Benefit case was not found in the system of record.
                    correlationId: demo-corr-404
                    auditEventId: aud-demo-404-001
        "504":
          description: Legacy system timeout or unavailable system of record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                legacyTimeout:
                  summary: Legacy timeout while building decision context
                  value:
                    errorCode: LEGACY_TIMEOUT
                    message: Legacy system did not respond within the service threshold.
                    correlationId: demo-corr-timeout
                    auditEventId: aud-demo-timeout-001
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: VERIFY final enforcement in API Manager or gateway. For local demo, client-id enforcement can be substituted.
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.invalid/oauth2/token
          scopes:
            benefit-case.context.read: Read benefit decision context.
  schemas:
    BenefitCaseDecisionContext:
      type: object
      additionalProperties: false
      required:
        - caseId
        - citizenDisplayName
        - citizenRefMasked
        - benefitType
        - statusCode
        - statusLabel
        - preferredChannel
        - slaStatus
        - nextAction
        - handoffRequired
        - sourceSystem
        - correlationId
        - auditEventId
      properties:
        caseId:
          type: string
          example: BEN-2026-004219
        citizenDisplayName:
          type: string
          example: Persona Demo A
        citizenRefMasked:
          type: string
          description: Masked citizen reference only. Never expose unmasked identifiers in this demo.
          example: CIT-****-4219
        benefitType:
          type: string
          example: Benefit renewal
        statusCode:
          type: string
          enum:
            - PENDING_DOCUMENT
            - UNDER_REVIEW
            - APPROVED
            - SCHEDULED_APPOINTMENT
            - IN_PROGRESS
            - WAITING_CITIZEN_RESPONSE
            - ESCALATED_TO_AGENT
            - CLOSED
          example: PENDING_DOCUMENT
        statusLabel:
          type: string
          example: Pending document
        missingDocument:
          type: string
          nullable: true
          example: Proof of residence
        deadline:
          type: string
          format: date
          nullable: true
          example: "2026-07-05"
        preferredChannel:
          type: string
          example: WhatsApp
        slaStatus:
          type: string
          enum:
            - ON_TRACK
            - AT_RISK
            - BREACHED
            - IN_PROGRESS
            - UNKNOWN
          example: AT_RISK
        nextAction:
          type: string
          example: Upload proof of residence before 2026-07-05.
        handoffRequired:
          type: boolean
          example: false
        handoffReason:
          type: string
          nullable: true
          example: Appeal or exception requires human judgment.
        sourceSystem:
          type: string
          enum:
            - COBOLSIM
          example: COBOLSIM
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        correlationId:
          type: string
          example: demo-corr-001
        auditEventId:
          type: string
          description: Append-only audit event id used by downstream KPI instrumentation.
          example: aud-demo-4219-001
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
        - auditEventId
      properties:
        errorCode:
          type: string
          example: LEGACY_TIMEOUT
        message:
          type: string
          example: Legacy system did not respond within the service threshold.
        correlationId:
          type: string
          example: demo-corr-timeout
        auditEventId:
          type: string
          example: aud-demo-timeout-001
