openapi: 3.0.3
info:
  title: Agentforce Benefit Experience API
  version: 0.1.0-draft
  description: |
    Draft Experience API for the Salesforce citizen-service demonstration.

    API-led layer: Experience API.
    Downstream process API: benefit-case-prc-api.
    Intended consumer: Agentforce action, portal assistant, or contact-center copilot.

    This contract is intentionally action-safe: it minimizes PII, hides legacy details,
    returns citizen-ready language, and carries correlation/audit identifiers for
    oversight. It is a design artifact, not a deployed runtime.
servers:
  - url: https://{host}/{basePath}
    variables:
      host:
        default: api.example.invalid
        description: VERIFY runtime host after CloudHub 2.0, Runtime Fabric, or gateway target is selected.
      basePath:
        default: agentforce-benefit-exp-api/v1
tags:
  - name: Agent Actions
security:
  - clientCredentials: []
paths:
  /agent-actions/benefit-status-check:
    post:
      tags:
        - Agent Actions
      summary: Return action-safe benefit status for Agentforce
      operationId: checkBenefitStatusForAgentforce
      description: |
        Adapts the Process API decision context into a minimal, citizen-ready response
        that Agentforce can use without exposing raw legacy fields.
      parameters:
        - name: x-correlation-id
          in: header
          required: false
          description: Optional caller-provided correlation id for end-to-end traceability.
          schema:
            type: string
            minLength: 8
            maxLength: 80
            example: demo-corr-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BenefitStatusCheckRequest"
            examples:
              mariaRequest:
                summary: Maria asks for benefit status
                value:
                  caseId: BEN-2026-004219
                  maskedReference: CIT-****-4219
                  channel: WhatsApp
                  locale: es-CO
              valentinaRequest:
                summary: Valentina asks about an appeal
                value:
                  caseId: BEN-2026-004227
                  maskedReference: CIT-****-1008
                  channel: Phone
                  locale: es-CO
      responses:
        "200":
          description: Action-safe result for the agent.
          headers:
            x-correlation-id:
              description: Correlation id propagated or generated by the API.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBenefitStatusResult"
              examples:
                mariaPendingDocument:
                  summary: Maria can be answered autonomously
                  value:
                    outcome: ANSWER
                    caseId: BEN-2026-004219
                    maskedReference: CIT-****-4219
                    statusLabel: Pending document
                    citizenMessage: Your benefit renewal is pending one document. Please upload proof of residence before 2026-07-05.
                    missingDocument: Proof of residence
                    deadline: "2026-07-05"
                    nextAction: Upload proof of residence.
                    handoffRequired: false
                    handoffReason: null
                    correlationId: demo-corr-001
                    auditEventId: aud-demo-4219-001
                valentinaEscalated:
                  summary: Valentina is routed to a human
                  value:
                    outcome: HANDOFF
                    caseId: BEN-2026-004227
                    maskedReference: CIT-****-1008
                    statusLabel: Escalated to agent
                    citizenMessage: Your case includes an appeal or exception. I will route it to a public servant with the case context attached.
                    missingDocument: Proof of residence
                    deadline: "2026-07-24"
                    nextAction: Wait for human review.
                    handoffRequired: true
                    handoffReason: Appeal or exception requires human judgment.
                    correlationId: demo-corr-002
                    auditEventId: aud-demo-4227-001
                caseNotFound:
                  summary: Case not found with safe response
                  value:
                    outcome: NOT_FOUND
                    caseId: BEN-2026-999999
                    maskedReference: CIT-****-9999
                    statusLabel: Not found
                    citizenMessage: I could not find a benefit case with that information. Please confirm the case number or continue with a public servant.
                    missingDocument: null
                    deadline: null
                    nextAction: Confirm the case number.
                    handoffRequired: true
                    handoffReason: The case could not be found with the provided information.
                    correlationId: demo-corr-404
                    auditEventId: aud-demo-404-001
                legacyTimeout:
                  summary: Legacy timeout with graceful degradation
                  value:
                    outcome: TEMPORARILY_UNAVAILABLE
                    caseId: BEN-2026-004219
                    maskedReference: CIT-****-4219
                    statusLabel: Temporarily unavailable
                    citizenMessage: I cannot consult your case right now because the benefits system is not responding. I will route this request so a public servant can follow up.
                    missingDocument: null
                    deadline: null
                    nextAction: Route for human follow-up.
                    handoffRequired: true
                    handoffReason: Legacy system timeout.
                    correlationId: demo-corr-timeout
                    auditEventId: aud-demo-timeout-001
        "400":
          description: Invalid request for the agent action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: VERIFY final enforcement in API Manager or gateway. For local demo, client-id enforcement can be substituted.
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.invalid/oauth2/token
          scopes:
            agentforce-benefit.status.check: Check benefit status for an agent action.
  schemas:
    BenefitStatusCheckRequest:
      type: object
      additionalProperties: false
      required:
        - caseId
        - channel
      properties:
        caseId:
          type: string
          pattern: ^BEN-[0-9]{4}-[0-9]{6}$
          example: BEN-2026-004219
        maskedReference:
          type: string
          nullable: true
          description: Optional masked citizen reference, never a full identifier.
          example: CIT-****-4219
        channel:
          type: string
          enum:
            - Portal
            - WhatsApp
            - Phone
            - ServiceConsole
          example: WhatsApp
        locale:
          type: string
          nullable: true
          example: es-CO
    AgentBenefitStatusResult:
      type: object
      additionalProperties: false
      required:
        - outcome
        - caseId
        - statusLabel
        - citizenMessage
        - nextAction
        - handoffRequired
        - correlationId
        - auditEventId
      properties:
        outcome:
          type: string
          enum:
            - ANSWER
            - HANDOFF
            - NOT_FOUND
            - TEMPORARILY_UNAVAILABLE
          example: ANSWER
        caseId:
          type: string
          example: BEN-2026-004219
        maskedReference:
          type: string
          nullable: true
          example: CIT-****-4219
        statusLabel:
          type: string
          example: Pending document
        citizenMessage:
          type: string
          description: Citizen-ready response text for Agentforce.
          example: Your benefit renewal is pending one document.
        missingDocument:
          type: string
          nullable: true
          example: Proof of residence
        deadline:
          type: string
          format: date
          nullable: true
          example: "2026-07-05"
        nextAction:
          type: string
          example: Upload proof of residence.
        handoffRequired:
          type: boolean
          example: false
        handoffReason:
          type: string
          nullable: true
          example: Legacy system timeout.
        correlationId:
          type: string
          example: demo-corr-001
        auditEventId:
          type: string
          description: Append-only audit event id used by downstream KPI instrumentation.
          example: aud-demo-4219-001
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
      properties:
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request is missing a required field.
        correlationId:
          type: string
          example: demo-corr-001
