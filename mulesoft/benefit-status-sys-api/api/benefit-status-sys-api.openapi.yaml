openapi: 3.0.3
info:
  title: Benefit Status System API
  version: 0.1.0-draft
  description: |
    Draft System API for the Salesforce citizen-service demonstration.

    API-led layer: System API.
    System of record: Oracle Autonomous Database as a demo stand-in for a COBOL/Java legacy core.
    Intended upstream consumers: Process API, Experience API, Agentforce-facing API, or contact-center tooling.

    This contract exposes only synthetic, minimized benefit-status data for the citizen-service demo.
servers:
  - url: https://{host}/{basePath}
    variables:
      host:
        default: api.example.invalid
        description: VERIFY runtime host after CloudHub 2.0, Runtime Fabric, or local runtime is selected.
      basePath:
        default: benefit-status-sys-api/v1
tags:
  - name: Benefit Cases
security:
  - clientCredentials: []
paths:
  /benefit-cases/{caseId}/status:
    get:
      tags:
        - Benefit Cases
      summary: Get benefit case status from the legacy system of record
      operationId: getBenefitCaseStatus
      description: |
        Returns the current status of a synthetic citizen benefit case.
        This is a read-only System API operation.
      parameters:
        - name: caseId
          in: path
          required: true
          description: Demo benefit case identifier.
          schema:
            type: string
            pattern: ^BEN-[0-9]{4}-[0-9]{6}$
            example: BEN-2026-004219
        - name: x-correlation-id
          in: header
          required: false
          description: Optional caller-provided correlation id for audit traceability.
          schema:
            type: string
            minLength: 8
            maxLength: 80
            example: demo-corr-001
      responses:
        "200":
          description: Benefit case found.
          headers:
            x-correlation-id:
              description: Correlation id propagated or generated by the API.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BenefitCaseStatus"
              examples:
                mariaPendingDocument:
                  summary: Persona Demo A pending proof of residence
                  value:
                    caseId: BEN-2026-004219
                    citizenDisplayName: Persona Demo A
                    citizenRefMasked: CIT-****-4219
                    benefitType: Benefit renewal
                    status: PENDING_DOCUMENT
                    missingDocument: Proof of residence
                    nextDeadline: "2026-07-05"
                    preferredChannel: WhatsApp
                    lastUpdatedAt: "2026-07-01T00:00:00Z"
                    sourceSystem: COBOLSIM
                    correlationId: demo-corr-001
                valentinaEscalated:
                  summary: Persona Demo B appeal requires human review
                  value:
                    caseId: BEN-2026-004227
                    citizenDisplayName: Persona Demo B
                    citizenRefMasked: CIT-****-1008
                    benefitType: Benefit renewal
                    status: ESCALATED_TO_AGENT
                    missingDocument: Proof of residence
                    nextDeadline: "2026-07-24"
                    preferredChannel: Phone
                    lastUpdatedAt: "2026-07-01T00:00:00Z"
                    sourceSystem: COBOLSIM
                    correlationId: demo-corr-002
        "400":
          description: Invalid case id or malformed request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Case not found in the system of record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                caseNotFound:
                  summary: Benefit case not found
                  value:
                    errorCode: CASE_NOT_FOUND
                    message: Benefit case was not found.
                    correlationId: demo-corr-404
        "500":
          description: Unexpected integration or legacy-system error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: VERIFY final enforcement in API Manager or gateway. For local demo, client-id enforcement can be substituted.
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.invalid/oauth2/token
          scopes:
            benefit-status.read: Read benefit status.
  schemas:
    BenefitCaseStatus:
      type: object
      additionalProperties: false
      required:
        - caseId
        - citizenDisplayName
        - citizenRefMasked
        - benefitType
        - status
        - preferredChannel
        - sourceSystem
        - correlationId
      properties:
        caseId:
          type: string
          example: BEN-2026-004219
        citizenDisplayName:
          type: string
          example: Persona Demo A
        citizenRefMasked:
          type: string
          description: Masked citizen reference only. Never expose unmasked identifiers in this demo.
          example: CIT-****-4219
        benefitType:
          type: string
          example: Benefit renewal
        status:
          type: string
          enum:
            - PENDING_DOCUMENT
            - UNDER_REVIEW
            - APPROVED
            - SCHEDULED_APPOINTMENT
            - IN_PROGRESS
            - WAITING_CITIZEN_RESPONSE
            - ESCALATED_TO_AGENT
            - CLOSED
          example: PENDING_DOCUMENT
        missingDocument:
          type: string
          nullable: true
          example: Proof of residence
        nextDeadline:
          type: string
          format: date
          nullable: true
          example: "2026-07-05"
        preferredChannel:
          type: string
          example: WhatsApp
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        sourceSystem:
          type: string
          enum:
            - COBOLSIM
          example: COBOLSIM
        correlationId:
          type: string
          example: demo-corr-001
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
        - correlationId
      properties:
        errorCode:
          type: string
          example: CASE_NOT_FOUND
        message:
          type: string
          example: Benefit case was not found.
        correlationId:
          type: string
          example: demo-corr-001
